<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webadmin@agrarix.nl
    ServerName www.wennink.eu
    ServerAlias wennink.eu
    DocumentRoot /var/www/vhosts/www.wennink.eu/html
    ErrorLog ${APACHE_LOG_DIR}/wennink.log
    CustomLog ${APACHE_LOG_DIR}/wennink.log combined
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =www.wennink.eu [OR]
# RewriteCond %{SERVER_NAME} =wennink.eu
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/www.wennink.eu/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/www.wennink.eu/privkey.pem
</VirtualHost>
</IfModule>
